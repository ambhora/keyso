site_name: Keyso
site_url: https://ambhora.github.io/keyso/
site_description: A language for finite sets of configurations
site_author: Jayesh Badwaik
docs_dir: docs
site_dir: build/site

repo_name: ambhora/keyso
repo_url: https://github.com/ambhora/keyso
edit_uri: edit/main/docs/

copyright: Copyright © keyso developers · Apache-2.0

theme:
  name: materialx
  features:
    - content.code.copy
    - navigation.instant
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/keyso.css

# MathJax renders the formalism; the configuration must load before MathJax.
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

# Strict builds fail on any broken link or anchor.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search

nav:
  - Home: index.md
  - Language:
      - language/index.md
      - Operands: language/operands.md
      - Values: language/values.md
      - Operations: language/operations.md
      - References and nesting: language/composition.md
      - Normal form: language/normal-form.md
      - Reference: language/reference.md
  - Formalism:
      - formalism/index.md
      - Algebra: formalism/algebra.md
      - Semantics: formalism/semantics.md
  - Examples: examples.md
  - Design notes: design.md
