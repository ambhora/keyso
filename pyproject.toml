[project]
name = "keyso-language-docs"
version = "0.1.0"
description = "Standalone MkDocs website for the Keyso dictionary language"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Jayesh Badwaik", email = "j.badwaik@fz-juelich.de" },
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Source = "https://github.com/ambhora/keyso-language"

[tool.hatch.envs.docs]
skip-install = true
dependencies = [
  "mkdocs-material",
  "pymdown-extensions",
]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build --strict"
serve = "mkdocs serve"
