[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keyso-docs"
version = "0.1.0"
description = "Specification for keyso"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7",
    "pygments>=2.17.0",
]

[tool.uv]
package = false
